<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – Campus Lost &amp; Found</title>
  <style>
    body   { font-family: Arial, sans-serif; margin: 24px; }
    h1     { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Create an account</h1>

  <p class="error" th:if="${error}" th:text="${error}">Error message</p>

  <!-- th:action adds the CSRF token as a hidden field automatically -->
  <form th:action="@{/register}" method="post">
    <p>
      <label for="username">Username</label><br>
      <input id="username" name="username" th:value="${username}" required>
    </p>
    <p>
      <label for="password">Password</label><br>
      <input id="password" name="password" type="password" required>
    </p>
    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
</body>
</html>
