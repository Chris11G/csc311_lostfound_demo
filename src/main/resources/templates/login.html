<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Campus Lost &amp; Found</title>
  <style>
    body     { font-family: Arial, sans-serif; margin: 24px; }
    h1       { color: green; }
    .error   { color: red; }
    .message { color: green; }
  </style>
</head>
<body>
  <h1>Sign in</h1>

  <p class="message" th:if="${param.registered}">Account created. Please sign in.</p>
  <p class="error"   th:if="${param.error}">Wrong username or password.</p>
  <p class="message" th:if="${param.logout}">You have signed out.</p>

  <!-- th:action adds the CSRF token as a hidden field automatically -->
  <form th:action="@{/login}" method="post">
    <p>
      <label for="username">Username</label><br>
      <input id="username" name="username" required autofocus>
    </p>
    <p>
      <label for="password">Password</label><br>
      <input id="password" name="password" type="password" required>
    </p>
    <button type="submit">Sign in</button>
  </form>

  <p>New here? <a th:href="@{/register}">Create an account</a></p>
</body>
</html>
